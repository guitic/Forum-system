<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="登录 / 注册 - 技术交流论坛" />
  <title>登录 / 注册 - 技术论坛</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <div class="app">
    <!-- ==================== Header ==================== -->
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="logo-mark">T</span>
          <span>技术论坛</span>
        </a>
        <div class="nav-actions" id="nav-actions">
          <!-- 由 auth.js 动态渲染 -->
        </div>
      </div>
    </header>

    <!-- ==================== Main ==================== -->
    <main>
      <div class="container">
        <div class="auth-wrap">
          <div class="card auth-card">
            <div class="brand">
              <div class="brand-logo">T</div>
              <h1>欢迎来到技术论坛</h1>
              <p>登录或注册账号，开始你的技术探索之旅</p>
            </div>

            <!-- Tab 切换 -->
            <div class="auth-tabs">
              <button class="auth-tab active" data-mode="login" type="button">登录</button>
              <button class="auth-tab" data-mode="register" type="button">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="login-panel" class="hidden" novalidate>
              <div id="login-form">
                <div class="form-group" id="login-username-group">
                  <label class="form-label" for="login-username">
                    用户名 <span class="required">*</span>
                  </label>
                  <input
                    type="text"
                    id="login-username"
                    class="form-control"
                    placeholder="请输入用户名"
                    autocomplete="username"
                    maxlength="50"
                  />
                  <div class="form-error">请输入用户名</div>
                </div>
                <div class="form-group" id="login-password-group">
                  <label class="form-label" for="login-password">
                    密码 <span class="required">*</span>
                  </label>
                  <input
                    type="password"
                    id="login-password"
                    class="form-control"
                    placeholder="请输入密码"
                    autocomplete="current-password"
                    maxlength="72"
                  />
                  <div class="form-error">请输入密码</div>
                </div>
                <button id="login-submit-btn" class="btn btn-primary btn-lg btn-block" type="submit">
                  登 录
                </button>
              </div>
            </form>

            <!-- 注册表单 -->
            <div id="register-panel" class="hidden">
              <form id="register-form" novalidate>
                <div class="form-group" id="register-username-group">
                  <label class="form-label" for="register-username">
                    用户名 <span class="required">*</span>
                  </label>
                  <input
                    type="text"
                    id="register-username"
                    class="form-control"
                    placeholder="8-14位，首位小写字母，需含字母和数字"
                    autocomplete="username"
                    minlength="8"
                    maxlength="14"
                    pattern="[a-z][a-zA-Z0-9]*"
                    title="首位须为小写字母，仅含字母和数字"
                  />
                  <div class="form-error">请输入用户名</div>
                </div>
                <div class="form-group" id="register-password-group">
                  <label class="form-label" for="register-password">
                    密码 <span class="required">*</span>
                  </label>
                  <input
                    type="password"
                    id="register-password"
                    class="form-control"
                    placeholder="至少8位，需含字母、数字和特殊字符"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                  />
                  <div class="form-error">请输入密码</div>
                </div>
                <div class="form-group" id="register-confirm-group">
                  <label class="form-label" for="register-confirm">
                    确认密码 <span class="required">*</span>
                  </label>
                  <input
                    type="password"
                    id="register-confirm"
                    class="form-control"
                    placeholder="再次输入密码"
                    autocomplete="new-password"
                    maxlength="72"
                  />
                  <div class="form-error">请再次输入密码</div>
                </div>
                <button id="register-submit-btn" class="btn btn-primary btn-lg btn-block" type="submit">
                  注 册
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ==================== Footer ==================== -->
    <footer class="footer">
      <div class="container">
        <span>技术交流论坛 · 纯 HTML + JS 实现</span>
      </div>
    </footer>
  </div>

  <!-- ==================== Toast ==================== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ==================== Scripts ==================== -->
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=4"></script>
</body>
</html>

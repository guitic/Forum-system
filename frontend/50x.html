<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="服务暂时不可用 - GraphFlow 技术交流论坛" />
  <title>服务暂时不可用 - GraphFlow 技术交流论坛</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=14" />
  <style>
    /* Nocturne Glassmorphism：错误页专属布局，沿用全站玻璃令牌 */
    .err-wrap { display: flex; align-items: center; justify-content: center; padding: 64px 16px; }
    .err-card { max-width: 520px; width: 100%; text-align: center; padding: 48px 32px; }
    .err-code {
      font-size: 72px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 2px;
      color: var(--danger-text);
      text-shadow: 0 4px 24px rgba(224, 138, 138, 0.24);
    }
    .err-title { margin: 18px 0 10px; font-size: 20px; font-weight: 600; color: var(--t-1); }
    .err-desc { margin: 0 0 26px; font-size: 14px; line-height: 1.75; color: var(--t-2); }
    .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="logo" aria-label="返回 GraphFlow 技术交流论坛 首页">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2zm3 5h10v1.6H7V9zm0 4h7v1.6H7V13z"/></svg>
          </span>
          <span>GraphFlow 论坛</span>
        </a>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="err-wrap">
          <div class="card err-card">
            <div class="err-code">500</div>
            <h1 class="err-title">服务暂时不可用</h1>
            <p class="err-desc">服务器开小差了，请稍后重试。若持续出现，请联系管理员。</p>
            <div class="err-actions">
              <a class="btn btn-primary" href="index.html">返回首页</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="帖子详情 - 技术交流论坛" />
  <title>帖子详情 - 技术论坛</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=13" />
  <!-- marked.js - Markdown 解析 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- highlight.js - 代码高亮（浏览器预构建版，含所有常用语言） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- ==================== Header ==================== -->
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="logo-mark">T</span>
          <span>技术论坛</span>
        </a>
        <div class="nav-actions" id="nav-actions">
          <!-- 由 post.js 动态渲染 -->
        </div>
      </div>
    </header>

    <!-- ==================== Main ==================== -->
    <main>
      <div class="container">
        <!-- 加载中 -->
        <div id="post-loading" class="loading" style="padding:80px 20px">正在加载帖子…</div>

        <!-- 帖子详情 -->
        <div id="post-detail-wrapper" class="hidden">
          <article class="card post-detail">
            <div class="post-detail-head">
              <div class="post-detail-head-main">
                <h1 id="post-title" class="post-detail-title"></h1>
                <!-- 数据到达前的浏览量占位（模块 3），渲染后由 post.js 替换 -->
                <div id="post-meta" class="post-detail-meta">
                  <span class="meta-views meta-views-placeholder">👁 -- 浏览</span>
                </div>
              </div>
              <div id="post-actions" class="post-actions-bar"></div>
            </div>
            <div id="post-content" class="md-content"></div>
            <!-- 编辑标记（模块 1：updated_at 非空时显示） -->
            <div id="post-edited-mark" class="edited-mark hidden"></div>

            <!-- 帖子编辑表单（模块 1：作者/管理员内联编辑） -->
            <div id="post-edit-form" class="edit-form hidden">
              <div class="form-group" id="post-edit-title-group">
                <label class="form-label" for="post-edit-title">
                  标题 <span class="required">*</span>
                </label>
                <input
                  id="post-edit-title"
                  class="form-control"
                  type="text"
                  maxlength="200"
                  placeholder="帖子标题"
                />
              </div>
              <div class="form-group" id="post-edit-content-group">
                <label class="form-label" for="post-edit-content">
                  内容 <span class="required">*</span>
                </label>
                <textarea
                  id="post-edit-content"
                  class="form-control md-editor"
                  placeholder="帖子内容，支持 Markdown 语法"
                ></textarea>
              </div>
              <div class="edit-form-actions">
                <span id="post-edit-error" class="edit-error" role="alert"></span>
                <span class="edit-form-hint">
                  <kbd>Ctrl/Cmd</kbd> + <kbd>Enter</kbd> 快速保存
                </span>
                <button id="post-edit-cancel-btn" class="btn" type="button">取消</button>
                <button id="post-edit-save-btn" class="btn btn-primary" type="button">保存</button>
              </div>
            </div>
          </article>

          <!-- 回复区域 -->
          <section class="replies-section">
            <h2 class="replies-title">
              回复 <span id="reply-count" class="count">0</span>
              <span class="hint">· 支持楼中楼，最多 3 层</span>
            </h2>

            <!-- 回复列表 -->
            <div id="reply-list" class="reply-list"></div>

            <!-- 登录提示（未登录时显示） -->
            <div id="reply-login-prompt" class="login-prompt hidden"></div>

            <!-- 回复表单（已登录时显示） -->
            <div id="reply-form" class="reply-form hidden">
              <div class="form-card">
                <div class="form-group" id="reply-group">
                  <label class="form-label" for="reply-content">
                    发表回复 <span class="required">*</span>
                  </label>
                  <textarea
                    id="reply-content"
                    class="form-control md-editor"
                    placeholder="发表你的观点，支持 Markdown（回复某条回复请点该条下方的「回复」）"
                  ></textarea>
                  <div class="form-hint">
                    支持 Markdown 语法 · <kbd>Ctrl/Cmd</kbd> + <kbd>Enter</kbd> 快速提交
                  </div>
                  <div class="form-error">请输入回复内容</div>
                </div>
                <!-- 图片上传区（一级回复） -->
                <div id="reply-images"></div>
                <div class="reply-form-actions">
                  <span class="reply-form-hint">一级回复 · 支持 Markdown 与图片</span>
                  <button id="reply-submit-btn" class="btn btn-primary">发布回复</button>
                </div>
              </div>
            </div>
          </section>
        </div>

        <!-- 未找到 -->
        <div id="post-not-found" class="empty-state hidden"></div>
      </div>
    </main>

    <!-- ==================== Footer ==================== -->
    <footer class="footer">
      <div class="container">
        <span>技术交流论坛 · 纯 HTML + JS 实现</span>
      </div>
    </footer>
  </div>

  <!-- ==================== 删除确认弹窗 ==================== -->
  <div id="confirm-backdrop" class="confirm-backdrop hidden">
    <div class="confirm-dialog">
      <div class="confirm-icon">⚠</div>
      <h3 class="confirm-title">确认删除</h3>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel-btn" class="btn">取消</button>
        <button id="confirm-delete-btn" class="btn btn-danger">确认删除</button>
      </div>
    </div>
  </div>

  <!-- ==================== Toast ==================== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ==================== Scripts ==================== -->
  <script src="js/api.js?v=7"></script>
  <script src="js/image-upload.js?v=2"></script>
  <script src="js/post.js?v=14"></script>
</body>
</html>

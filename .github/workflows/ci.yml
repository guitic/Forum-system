name: CI

# 触发时机：
#   - push 到主分支
#   - 任何面向主分支的 PR
# 目的：在合并前把「语法/导入错误、接口契约破坏、回归失败」挡在主干之外。
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# 同一分支的新推送取消旧的进行中任务，节省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法与导入检查
        # 编译全部源码，提前暴露 SyntaxError / 缩进等问题
        run: python -m compileall -q .

      - name: 校验应用可导入且路由表完整
        # 断言关键路由存在，防止重构误删接口（契约回归）
        env:
          FORUM_SKIP_SECRET_CHECK: "1"
          DATABASE_URL: "sqlite:///./_ci_import.db"
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from app import create_app
          app = create_app()
          rules = {str(r.rule): sorted(r.methods - {"HEAD", "OPTIONS"})
                   for r in app.url_map.iter_rules()}
          required = [
              "/api/auth/login", "/api/auth/register",
              "/api/posts", "/api/posts/<int:post_id>",
              "/api/posts/<int:post_id>/replies",
              "/api/replies/<int:reply_id>",
              "/api/stats", "/api/user/profile", "/api/user/password",
              "/api/user/avatar",
              "/api/upload/init", "/api/upload/chunk",
              "/api/upload/complete", "/api/upload/status",
              "/health",
          ]
          missing = [p for p in required if p not in rules]
          if missing:
              print("缺失路由:", missing)
              sys.exit(1)
          print(f"路由校验通过，共 {len(rules)} 条")
          PY

      - name: 运行端到端测试
        env:
          FORUM_SKIP_SECRET_CHECK: "1"
        # run_tests.py 逐个以子进程运行各套件，退出码非 0 即失败
        run: python run_tests.py

  frontend:
    name: 前端静态检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS 语法检查
        # 逐个文件做语法解析，捕获语法错误（非 Node 模块，用 --check 等价方式）
        working-directory: frontend
        run: |
          fail=0
          for f in js/*.js; do
            if ! node --check "$f"; then
              echo "语法错误: $f"
              fail=1
            fi
          done
          exit $fail

      - name: 关键页面与资源存在性检查
        working-directory: frontend
        run: |
          set -e
          for f in index.html post.html auth.html profile.html \
                   css/style.css js/api.js js/index.js js/post.js js/auth.js; do
            if [ ! -f "$f" ]; then
              echo "缺失文件: $f"
              exit 1
            fi
          done
          echo "前端文件校验通过"

# ============================================================================
# 安全响应头片段（供 server 级与各 location 复用）
# ----------------------------------------------------------------------------
# 为什么要抽成单独文件：
#   nginx 的 add_header 遵循「就近覆盖」语义 —— 一旦某个 location 块内出现
#   任何 add_header，该 location 就**不再继承** server 级的所有 add_header。
#   因此 /、/*.html、静态资源、/uploads/ 等定义了 Cache-Control 的 location
#   会丢失 HSTS / CSP / X-Frame-Options 等全部安全头（属于真实安全缺陷）。
#   解决办法：把这些头抽成 snippet，在所有需要 add_header 的 location 中
#   用 include 重新引入。
# 用法：在 server 块与每个含 add_header 的 location 中：
#   include /etc/nginx/snippets/forum-security-headers.conf;
# ============================================================================

# HSTS: 强制 HTTPS，包含子域
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;
# 点击劫持防护
add_header X-Frame-Options "SAMEORIGIN" always;
# XSS 过滤器
add_header X-XSS-Protection "1; mode=block" always;
# 限制浏览器下载方式
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP: 前端全部资源(含 marked.js / highlight.js)均已本地自托管，
# 故 script-src 收紧为 'self'，不再放开任何 CDN 域名。
# style-src 保留 'unsafe-inline'：页面存在内联 <style> 块与 style= 属性。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
# 限制权限策略
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
# 自定义跨源策略
add_header Cross-Origin-Opener-Policy "same-origin" always;

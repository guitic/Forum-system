# ============================================================================
# 论坛系统 Nginx 配置 (生产级)
# 部署位置: /etc/nginx/conf.d/forum.conf  或  /etc/nginx/nginx.conf (合并)
# 适用: Rocky Linux 8/9 + Nginx 1.20+
# 说明:
#   - 前端静态资源直接由 Nginx 提供，加速并降低后端压力
#   - /api/ 反向代理至 Python 后端 (默认 127.0.0.1:5000)
#   - 开启 gzip 压缩、静态资源长缓存、安全响应头
#   - 隐藏 Nginx 版本号，禁用 Server 头信息泄露
# ============================================================================

# 全局上游定义：后端 Python 服务
# 若后续扩容可改为多实例负载均衡
upstream forum_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 日志格式定义：精简且含关键诊断字段
log_format forum_access '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'uht=$upstream_header_time urt=$upstream_response_time';

server {
    listen 80;
    listen 443 ssl http2;

    # ---------------------------- 域名与证书 ----------------------------
    server_name forum.example.com;

    # HTTPS 证书 (如未启用 HTTPS，可删除以下 ssl_* 行与 http2 关键字)
    ssl_certificate     /etc/nginx/ssl/forum.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/forum.example.com.key;

    # ---------------------------- TLS 安全加固 ----------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------------------- 隐藏版本号 ----------------------------
    server_tokens off;

    # ---------------------------- 上传与请求体限制 ----------------------------
    client_max_body_size 5m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 10000;

    # ---------------------------- 访问日志 ----------------------------
    access_log /var/log/nginx/forum_access.log forum_access;
    error_log  /var/log/nginx/forum_error.log warn;

    # ---------------------------- 安全响应头 ----------------------------
    # HSTS: 强制 HTTPS，包含子域
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 点击劫持防护
    add_header X-Frame-Options "SAMEORIGIN" always;
    # XSS 过滤器
    add_header X-XSS-Protection "1; mode=block" always;
    # 限制浏览器下载方式
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: 论坛前端使用 marked.js 与 fetch()，按需扩展脚本来源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.example.com; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # 限制权限策略
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # 自定义跨源策略（若需要跨域调试）
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---------------------------- gzip 压缩 ----------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;
    gzip_disable "msie6";

    # ---------------------------- 根路径: 前端静态资源 ----------------------------
    # 论坛前端代码位于 /opt/forum/frontend 目录下
    root /opt/forum/frontend;
    index index.html;
    charset utf-8;

    # 健康检查端点，不写日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 前端入口，HTML 文件不缓存（保证发版即时生效）
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # 关键页面: 同样禁止缓存
    location ~ ^/(index\.html|auth\.html|post\.html|login\.html|register\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 带哈希指纹的静态资源: 长缓存 (1 年)，文件名变更即刷新
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # robots.txt: 不缓存
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------------------------- /api/ 反向代理到后端 ----------------------------
    location /api/ {
        proxy_pass http://forum_backend/;

        # 透传请求头，让后端正确识别客户端 IP 与协议
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # 代理超时配置 (单位: 秒)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 后端响应缓冲
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;

        # 后端故障处理
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # 启用 HTTP keepalive 复用连接
        proxy_http_version 1.1;

        # 禁止客户端上传过大 body（后端 API 自身亦有校验）
        limit_req zone=forum_api burst=20 nodelay;

        # CORS 头 (前端同源部署时通常无需；如跨域可解开)
        # add_header Access-Control-Allow-Origin  $http_origin always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        # if ($request_method = OPTIONS) { return 204; }
    }

    # ---------------------------- 请求限速 ----------------------------
    # 限制单 IP 并发与速率，防爬防刷
    limit_req_zone $binary_remote_addr zone=forum_api:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=forum_conn:10m;
    limit_conn forum_conn 50;

    # ---------------------------- 错误页面 ----------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        internal;
        root /opt/forum/frontend;
    }
    location = /50x.html {
        internal;
        root /opt/forum/frontend;
    }

    # ---------------------------- 禁止访问隐藏文件 ----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------------------------- HTTP -> HTTPS 强制跳转 ----------------------------
    # 若仅监听 443，请删除以下 server 块
}

# 独立的 HTTP server 用于强制跳转 (保留在 443 块外部)
server {
    listen 80;
    server_name forum.example.com;
    server_tokens off;
    # 所有 80 端口请求 301 跳转至 HTTPS
    return 301 https://$host$request_uri;
}
